[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "packvium-native"
version = "0.1.1"
requires-python = ">=3.9"
description = "Backend selector for Packvium's native and pure Python engines"
license = "MIT"
dependencies = []

[project.optional-dependencies]
# `packvium` is deliberately not a hard dependency of the package itself (see
# README's "does not replace or shadow" note) -- it is only needed to exercise the
# fallback path in tests.
# The pure engine itself supports Python 3.10+, while this selector remains useful on
# Python 3.9 with the native wheel.  Keep the public 3.9 CI lane installable instead of
# asking pip to satisfy an impossible test-only dependency there.
test = ["pytest", "packvium; python_version >= '3.10'"]
# Convenience extra: `pip install packvium-native[native]` pulls in the compiled Rust
# wheel too, rather than requiring a second, separate install command.
native = ["packvium-native-rust"]

[tool.setuptools.packages.find]
where = ["src"]
